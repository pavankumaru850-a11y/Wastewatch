# Render Blueprint: hosts the WasteWatch API + a PostgreSQL database so the phone app works from anywhere.
# Steps are in DEPLOY_ONLINE.md. Render dashboard -> New -> Blueprint -> pick your GitHub repo.
databases:
  - name: wastewatch-db
    databaseName: wastewatch
    user: wastewatch
    plan: free            # free Postgres is deleted after 30 days; change to basic-256mb to keep it

services:
  - type: web
    name: wastewatch-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: standard        # PyTorch inference needs more memory than the 512 MB starter plan
    healthCheckPath: /api/health
    disk:                 # keeps citizen photos across restarts/deploys
      name: uploads
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wastewatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL     # you choose these two in the Render dashboard (they are asked on first deploy)
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
